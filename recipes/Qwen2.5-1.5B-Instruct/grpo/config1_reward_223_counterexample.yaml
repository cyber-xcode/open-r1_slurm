# Model arguments
model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2

# Data training arguments
dataset_name: 
  train: data_dir/verified_z3_benchmarks621_assert_y_withsmt.jsonl
  test: data_dir/evalset_asserty_smt_0to133.jsonl
#system_prompt: "You are a helpful AI Assistant that provides well-reasoned and detailed responses. You first think about the reasoning process as an internal monologue and then provide the user with the answer. Respond in the following format: <think>\n...\n</think>\n<answer>\n...\n</answer>"
system_prompt: "You are a helpful assistant. You first thinks about the reasoning process in the mind and then provides the user with the answer. Show your work in <think> </think> tags. And return the final answer in <answer> </answer> tags, for example <answer> assert( x+1 ==2 ); </answer>"


# GRPO trainer config
bf16: true
use_vllm: true
vllm_device: auto
vllm_gpu_memory_utilization: 0.8
do_eval: false
gradient_accumulation_steps: 4
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
hub_model_id: Qwen2.5-1.5B-Open-R1-z3621_multireward_counter_w10
hub_strategy: every_save
learning_rate: 2.0e-05
log_completions: true
log_level: info
logging_first_step: true
logging_steps: 5
logging_strategy: steps
lr_scheduler_type: cosine
max_prompt_length: 1024
max_completion_length: 1024
max_steps: -1
num_generations: 16
num_train_epochs: 8
output_dir: data/Qwen2.5-1.5BR1-z3621_multireward_counter_w10
overwrite_output_dir: true
per_device_eval_batch_size: 16
per_device_train_batch_size: 16
push_to_hub: false
report_to:
- tensorboard
- wandb
reward_funcs:
- reward_asserty_p_check_assert_syntax
- reward_asserty_p_is_cheating
- is_wired_text
- repetition_penalty
- tag_count


- reward_asserty_verify_with_z3_counterexample_local
- format

reward_weights:
- 1
- 1
- 1
- 1
- 1


- 10.0
- 1.0

save_strategy: "epoch"
save_steps: 100
save_total_limit: 1
#save_only_model: true


seed: 42
warmup_ratio: 0.1

eval_strategy: "epoch"
#eval_steps: 50  
