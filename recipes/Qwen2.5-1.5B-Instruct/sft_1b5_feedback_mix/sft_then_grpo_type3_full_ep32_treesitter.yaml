# Model arguments
model_name_or_path: data_feedback/qwen1b5-32768-sft-feedback-mix_ep32_nopack
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2

# Data training arguments
dataset_name: 
  train: data_dir/c_train_smt_benchmark_as_ref_valid_train_decontaminated_4a5bd042d9d9fc58dfeffc34f68d3307.jsonl
  test: data_dir/evalset_asserty_smt_0to133.jsonl


system_prompt: "You are a helpful AI Assistant that provides well-reasoned and detailed responses. You first think about the reasoning process as an internal monologue and then provide the user with the answer. Respond in the following format: <think>\n...\n</think>\n<answer>\n...\n</answer>"
prompt_type: 3  

# GRPO trainer config
bf16: true
use_vllm: true
vllm_device: auto
vllm_gpu_memory_utilization: 0.85
do_eval: false
gradient_accumulation_steps: 4
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
hub_model_id: grpo_sft_feedbackmerged_q15b_prompt_full_type3_mix_ep32_nopack
hub_strategy: every_save
learning_rate: 2.0e-05
log_completions: true
log_level: info
logging_first_step: true
logging_steps: 30
logging_strategy: steps
lr_scheduler_type: cosine
max_prompt_length: 512
max_completion_length: 1024
max_steps: -1
num_generations: 16
num_train_epochs: 10
output_dir: data_feedback/grpo_sft_feedbackmerged_q15b_mix_ep32_nopack_type3_full_ep32
overwrite_output_dir: true
per_device_eval_batch_size: 16
per_device_train_batch_size: 16
push_to_hub: false
report_to:
- tensorboard
- wandb
reward_funcs:
- format_seformal
- format
- tag_count
- reward_asserty_verify_with_z3_v2
reward_weights:
- 1.0
- 1.0
- 1.0
- 5.0
save_strategy: "steps"
save_steps: 500
save_total_limit: 20
save_only_model: false
seed: 42
warmup_ratio: 0.1
