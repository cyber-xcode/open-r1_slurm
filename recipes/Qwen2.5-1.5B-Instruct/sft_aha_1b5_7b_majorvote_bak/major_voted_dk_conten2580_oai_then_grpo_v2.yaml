# Model arguments
model_name_or_path: save_aha_dir/major_voted_dk_conten2580_oai
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2

# Data training arguments
dataset_name: 
  train: data_dir/c_train_smt_benchmark_as_ref_valid_train_decontaminated_removed_hardresolved_4b8bf386586250952146b91fb44fbde7_5000.jsonl
  test: data_dir/evalset_asserty_smt_0to133.jsonl


system_prompt: "You are a helpful AI Assistant that provides well-reasoned and detailed responses. You first think about the reasoning process as an internal monologue and then provide the user with the answer. Respond in the following format: <think>\n...\n</think>\n<answer>\n...\n</answer>"
prompt_type: 3  

# GRPO trainer config
bf16: true
use_vllm: true
vllm_device: auto
vllm_gpu_memory_utilization: 0.85
do_eval: false
gradient_accumulation_steps: 4
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
hub_model_id: grpo_sftl40s_q15b_prompt_onlyz3
hub_strategy: every_save
learning_rate: 2.0e-05
log_completions: true
log_level: info
logging_first_step: true
logging_steps: 30
logging_strategy: steps
lr_scheduler_type: cosine
max_prompt_length: 512
max_completion_length: 1024
max_steps: -1
num_generations: 16
num_train_epochs: 5
output_dir: save_aha_dir/major_voted_dk_conten2580_oai_then_grpo_corrected
overwrite_output_dir: true
per_device_eval_batch_size: 16
per_device_train_batch_size: 16
push_to_hub: false
report_to:
- tensorboard
- wandb
reward_funcs:
- reward_asserty_verify_with_z3_v2
- reward_asserty_verify_with_esbmc  
reward_weights:
- 1.0
- 1.0  
save_strategy: "steps"
save_steps: 200
save_total_limit: 1
seed: 42
warmup_ratio: 0.1
